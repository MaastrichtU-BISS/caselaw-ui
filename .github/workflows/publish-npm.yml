name: Publish to npm

# One package in this repo, so a plain version tag is unambiguous: v0.2.3, …
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and pack without publishing"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Typecheck
        run: npm run check

      # Catches a files/exports mistake before it reaches consumers, which a
      # typecheck alone would not.
      - name: Verify the tarball contents
        run: npm pack --dry-run

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Declaring any permission drops every default, so contents: read has to
      # be spelled out for actions/checkout.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME implies $tag_version but package.json says $pkg_version" >&2
            exit 1
          fi
          echo "Publishing caselaw-ui $pkg_version"

      # No NODE_AUTH_TOKEN: the OIDC identity is the credential, and npm
      # attaches provenance automatically for trusted publishes.
      - name: Publish to npm
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish
