<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BISS UI component preview</title>
    <style>
      /* The themed root paints --biss-bg; previews sit on a card surface to the frame's edge. */
      html[data-biss-theme] {
        background-color: var(--biss-card);
      }
      body {
        margin: 0;
        background: var(--biss-card);
        font: 14px/1.55 var(--biss-font-family);
        color: var(--biss-text);
      }
      #app {
        min-height: 240px;
      }
      html[data-example]:not([data-example='']) .dialog-example-frame {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 32px;
        background: var(--biss-card);
      }
      .authored-example {
        box-sizing: border-box;
        padding: 32px;
        background: var(--biss-card);
      }
      .authored-example[data-layout='center'] {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 220px;
      }
      @media (max-width: 480px) {
        .authored-example {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
